# Every tunable number and lexicon (03 §7, 02 §8.1, 04 §5 I-4). Hashed into config_hash with
# data/zones.yaml and data/catalog.yaml. All values are cold-start ASSUMPTIONS, not evidence.
version: 1
model:
  file: models/risk_xgb_v1.json
  features: [address_specificity, red_flag_count, tone_score, price_tnd, zone_encoded, customer_refusal_rate]
  # model_score = 100 · P(refused), from simulated outcomes (see card). Not a real-world refusal rate.

tiers:            { low_max: 35, medium_max: 65 }          # low < 35 <= medium < 65 <= high; fixed, not percentiles
confidence:       { boundary_margin: 10, max_dropped_flags: 1 }
actions:          { prepay_min_tnd: 250 }
auto_send:        { max_tnd: 150, max_auto_messages_per_order: 2 }

reply_adjustments:                                           # cold-start priors, not evidence
  confirmed:        { multiply: 0.6 }
  no_reply_timeout: { add: 15, route: needs_review }
final_score:      { clip: [0, 100], round: 0 }               # final = round(clip(model_score*mult + add, 0, 100))

outbound:
  static_insert_when_tier_at_least: medium

serve_defaults:
  address_specificity: 0.0
  red_flag_count: 0
  tone_score: 0
  price_tnd: 69
  zone_encoded: 1
  customer_refusal_rate: 0.30

catalog_match:    { min_score: 80, quantity_clamp: [1, 5] }

reasons:
  max_drivers: 3
  min_pts: 3
  always_show_zone_if_abs_pts_at_least: 3
  quote_max_chars: 40
  diff_min_delta_pts: 3
  linearise_if_abs_sum_phi_below: 0.05

timeouts:         { debounce_s: { demo: 4, prod: 15 }, no_reply_s: { demo: 60, prod: 21600 } }

window:           { max_messages: 12, max_chars: 2000 }

lexicons:
  ack:     [ok, oui, ey, eyh, behi, "d'accord", merci, "ya3tik saha", "نعم", "باهي", "إيه"]
  decline: [non, la, annuler, "ma nhebech", "لا", "ألغي"]
  # 04 §5 I-4: the ONLY injection lexicon. Phrase-level. `normalized` patterns run on
  # normalize(text) with Cf characters removed (casefolded, أ→ا, ة→ه); `defused` patterns run on the
  # length-preserving defused LLM view. More Arabic-script and Arabizi lines per FEDI.md F7.
  injection:
    normalized:
      - 'ignore\s+(?:(?:all|the|previous|prior|above|les|toutes les|tes)\s+){1,3}(?:instructions?|consignes|règles|rules)'
      - '(?:oublie|forget)\s+(?:tes|your)\s+(?:instructions|consignes)'
      - 'تجاهل\s+(?:كل\s+)?(?:التعليمات|الاوامر)'
      - 'you are now'
      - 'tu es maintenant'
      - 'system prompt'
      - 'address_level|confirmation\s*[:=]|injection_suspected|red_flags|risk_score'
      - '"exact"'
      - '(?:mark|classe?|set).{0,20}(?:low risk|faible risque|safe|score\s*0)'
    defused:
      - '(?:^|\s)(?:system|assistant|seller|vendeur|developer)\s*:'
      - '⟦\s*(?:SELLER|CUSTOMER)'
      - '⦃\s*"'

prefilter:        # 02 §8.1; a term in the draft and NOT in the template -> reject
  payment:   [carte, card, iban, rib, cvv, code, "mot de passe", password, virement, "numero de carte",
              "بطاقة", "كلمة السر", "الرمز", "حساب بنكي", "el carta", "numrou el carta"]
  discount:  [remise, promo, promotion, gratuit, gratuite, gratuitement, offert, offerte, cadeau,
              réduction, reduction, solde, soldes, free, batel, blech, "bla flous",
              "مجانا", "مجاني", "بلاش", "تخفيض", "هدية"]
  promise:   [garanti, garantie, "sans faute", promis, "je vous promets", madhmoun, "مضمون", "نوعدك", "nwa3dek"]
  allowlist: ["code postal"]    # F16: "code postal" passes
  max_chars: 400

roi:                                                         # every value is an ASSUMPTION; impact is simulated
  c_fail_tnd: 8.0                                            # [VERIFY] courier + return cost of one failed COD trip
  prevent_rate: { ship: 0.0, confirm: 0.30, prepay: 0.60 }
  prepay_conversion_loss: 0.10
  gross_margin: 0.25
  msg_cost_tnd: 0.0                                          # [VERIFY] WhatsApp service-window pricing
  sensitivity_confirm: [0.15, 0.30, 0.45]

text_clf: { enabled: false, file: models/text_clf_v1.joblib, min_prob: 0.6, disagree_levels: 2 }
