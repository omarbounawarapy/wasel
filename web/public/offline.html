<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · Wasel</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6f9; --card:#fff; --ink:#0b1d33; --muted:#4a5565; --brand:#12386b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f141b; --card:#151b24; --ink:#e8edf3; --muted:#b3bcc8; --brand:#2a62b0; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif; }
  main { max-width:28rem; background:var(--card); border-radius:16px; padding:32px; text-align:center; }
  h1 { font-size:1.25rem; margin:0 0 8px; }
  p { color:var(--muted); font-size:.9rem; line-height:1.5; margin:0 0 8px; }
  button { margin-top:16px; min-height:44px; padding:0 20px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:.9rem; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Wasel needs the server to score orders. Check your connection, then try again. Nothing you typed was sent.</p>
  <p lang="fr">Vous êtes hors ligne. Vérifiez votre connexion puis réessayez.</p>
  <p lang="ar" dir="rtl">أنت غير متصل بالإنترنت. تحقق من اتصالك ثم أعد المحاولة.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
