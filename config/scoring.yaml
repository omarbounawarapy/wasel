# Every tunable number and lexicon. Hashed into config_hash with
# data/zones.yaml and data/catalog.yaml. All values are cold-start ASSUMPTIONS, not evidence.
version: 1
model:
  file: models/risk_xgb_v1.json
  # model_score = 100 · P(refused), from simulated outcomes (see card). Not a real-world refusal rate.

tiers:            { low_max: 35, medium_max: 65 }          # low < 35 <= medium < 65 <= high; fixed, not percentiles
confidence:       { boundary_margin: 10, max_dropped_flags: 1 }
actions:          { prepay_min_tnd: 250 }
# auto_send.gate decides what may go out without a human click (route.py):
#   classifier — the guard classifier's decision alone: decision "send" (p_unsafe < classifier_hold_at)
#                auto-sends, "review" goes to the owner-approval queue. The LLM judge still runs when
#                available and its rejection still kills the rewrite; it is just not required to auto-send.
#   judge      — the LLM judge must approve AND the classifier must clear the draft (old rule).
# Both gates keep: prefilter pass, static templates on the human-click path, confidence high,
# price <= max_tnd, loop guard, 24 h window. Real WhatsApp sends additionally need WA_AUTO_SEND and
# never happen in public mode.
auto_send:        { max_tnd: 150, max_auto_messages_per_order: 2, gate: classifier }

reply_adjustments:                                           # cold-start priors, not evidence
  confirmed:        { multiply: 0.6 }
  no_reply_timeout: { add: 15 }
final_score:      { clip: [0, 100] }                         # final = round(clip(model_score*mult + add, 0, 100))

outbound:
  # draft judge: guard classifier p_unsafe >= block_at vetoes the rewrite; >= hold_at never auto_sends.
  # hold_at 0.1 (was 0.2, tightened when auto_send.gate became classifier and this line became the only
  # backstop with the judge down). Measured on the never-trained holdout bank: unsafe text cleared to send
  # drops 21% -> 11%, ~12% of safe drafts move to owner approval (safe, just slower), none blocked. 0.05
  # would clear only 4% of unsafe text but hold ~60% of safe golden rewrites — auto-send would almost
  # never fire. calibrate() weighs both sides when it suggests the line.
  judge: { classifier_block_at: 0.5, classifier_hold_at: 0.1, max_attempts: 2 }

catalog_match:    { min_score: 80, quantity_clamp: [1, 5] }

reasons:
  max_drivers: 3
  min_pts: 3
  always_show_zone_if_abs_pts_at_least: 3
  diff_min_delta_pts: 3
  linearise_if_abs_sum_phi_below: 0.05

timeouts:         { debounce_s: { demo: 4, prod: 15 }, no_reply_s: { demo: 60, prod: 21600 } }

window:           { max_messages: 12, max_chars: 2000 }

lexicons:
  ack:     [ok, oui, "yes", ey, eyh, behi, "d'accord", merci, "ya3tik saha", "je confirme", "نعم", "باهي", "إيه"]
  decline: [non, la, annuler, "ma nhebech", "لا", "ألغي"]
  # Whole-reply reading used by the rules extractor (rules_v1). A leading ack/decline word alone is not enough.
  # decline_explicit: a reply containing one is a decline unless it also starts with an ack or positive words.
  decline_explicit: [annule, annulez, annuler, "ne confirme pas", "confirme pas", "ne veux plus", "veux plus",
                     "ma nhebech", "ma n7ebech", "ألغي"]
  # contradiction: after a leading ack word these make the reply ambiguous ("oui mais ...", "ok finalement ...").
  contradiction: [mais, finalement, enfin, réfléchir, reflechir, pas, jamais, non, "لا", "ما", "مش", mouch, ma,
                  "7atta", "mafhemtech"]
  # unclear: the customer did not understand or is calling back; never a confirmation.
  unclear: [mafhemtech, "3ayet", "3ayetli", "pardon", "comment", "quoi"]
  # positive: after a leading "non" these make the reply ambiguous ("non ça ne me dérange pas, je prends").
  positive: ["je prends", "c'est bon", "ça ne me dérange pas", "je confirme", "d'accord", ok, oui, behi, "باهي", "نعم"]
  # a darija commitment with no product name ("nheb wa7ed noir" after "3andkom casque bluetooth?")
  # is an order; the fr ask ("je voudrais connaître la couleur") is not, so no fr verbs here.
  order_intent: [nheb, n7eb, nebghi, نوردر, نحب, نبغي]
  # Words that back the model's confirmation label (checked in postprocess). 'confirmed' needs an affirm word and no
  # negate word in the customer's reply after the seller line; 'declined' needs a negate word. Otherwise 'ambiguous'.
  agreement:
    affirm: [ok, okay, oui, "yes", ey, eyh, aya, behi, bahi, wakha, "d'accord", confirme, "je confirme", confirmé,
             "ya3tik saha", "نعم", "ايه", "إيه", "باهي", "اوكي", "موافق"]
    negate: [non, la, nn, annule, annuler, annulez, "ne veux pas", "veux pas", "ne veux plus", "veux plus", pas, jamais,
             "ma nhebech", "ma n7ebech", "mouch", "مش", "لا", "ما نحبش", "ما نيش", "ألغي", "الغي"]
  # The ONLY injection lexicon. Phrase-level. `normalized` patterns run on
  # normalize(text) with Cf characters removed (casefolded, أ→ا, ة→ه); `defused` patterns run on the
  # length-preserving defused LLM view.
  injection:
    # Extended variants: "risk rules" target,
    # mark/marque/7ot verbs with bare LOW, system/admin update-override headers, règle système,
    # unaccented "regles", Arabic قوانين / تحديث نظام.
    normalized:
      - 'ignore\s+(?:(?:all|the|previous|prior|above|les|toutes les|tes)\s+){1,3}(?:instructions?|consignes|r[eè]gles|rules|risk\s+rules)'
      - '(?:oublie|forget)\s+(?:tes|your)\s+(?:instructions|consignes)'
      - '(?:ignore[zr]?|oublie[zr]?|disregard)\s+(?:(?:all|the|previous|prior|above|everything|les|vos|toutes les|tes|ces|pr[eé]c[eé]dentes?)\s+){1,3}(?:instructions?|consignes|r[eè]gles|rules|above|ci-dessus|pr[eé]c[eé]dent\w*)'
      - '(?:forget|oubliez?)\s+(?:what|ce que)\s+(?:you|vous)'
      - '(?:new|nouvelles?)\s+(?:instructions?|consignes)\s*[:!]'
      - 'تجاهل\s+(?:كل\s+)?(?:ال)?(?:تعليمات|اوامر|قوانين)'
      - 'you are now'
      - 'tu es maintenant'
      - 'system prompt'
      - 'address_level|confirmation\s*[:=]|injection_suspected|red_flags|risk_score'
      - '"exact"'
      - '(?:mark|marque[z]?|classe?|set|7ot)\b.{0,20}(?:low(?:\s+risk)?|risk\s*low|risque\s*low|faible\s*risque|safe|score\s*0)'
      - '(?:system|admin)\s+(?:update|override|notice|message)\s*[:!]'
      - '(?:nouvelle\s+)?r[eè]gle\s+syst[eè]me\s*[:!]'
      - 'تحديث\s+نظام\s*[:：]'
    defused:
      - '(?:^|\s)(?:system|assistant|seller|vendeur|developer)\s*:'
      - '⟦\s*(?:SELLER|CUSTOMER)'
      - '⦃\s*"'

prefilter:        # a term in the draft and NOT in the template -> reject
  payment:   [carte, card, iban, rib, cvv, code, "mot de passe", password, virement, "numero de carte",
              "بطاقة", "كلمة السر", "الرمز", "حساب بنكي", "el carta", "numrou el carta"]
  discount:  [remise, promo, promotion, gratuit, gratuite, gratuitement, offert, offerte, cadeau,
              réduction, reduction, solde, soldes, free, batel, blech, "bla flous",
              "مجانا", "مجاني", "بلاش", "تخفيض", "هدية"]
  promise:   [garanti, garantie, "sans faute", promis, "je vous promets", madhmoun, "مضمون", "نوعدك", "nwa3dek"]
  allowlist: ["code postal"]    # "code postal" passes
  max_chars: 400

roi:                                                         # every value is an ASSUMPTION; impact is simulated
  c_fail_tnd: 8.0                                            # courier + return cost of one failed COD trip
  prevent_rate: { ship: 0.0, confirm: 0.30, prepay: 0.60 }
  prepay_conversion_loss: 0.10
  gross_margin: 0.25
  msg_cost_tnd: 0.0                                          # WhatsApp service-window pricing
  sensitivity_confirm: [0.15, 0.30, 0.45]
