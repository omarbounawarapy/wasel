# Render Blueprint: Wasel on the free web service (public demo mode). See docs/operations/render.md.
services:
  - type: web
    name: wasel
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass     # deploy a commit only after its CI checks pass
    envVars:
      - key: APP_MODE
        value: public
      - key: CLIENT_IP_HEADER          # per-address limits key on this header; Cloudflare's edge sets it and refuses a client-supplied one (confirmed 2026-10-14: the 30th write from one address got 429). If it is absent, no address is found and no per-address limit applies
        value: CF-Connecting-IP
      - key: LIVE_LLM_DAILY_CAP        # Increased for judging day (was default 80 in public mode)
        value: "500"
      - key: ADDR_LLM_SHARE            # Increased share of daily cap per address (was 0.25)
        value: "0.8"
      - key: VISITOR_LLM_CAP_DAY       # Increased per-visitor daily cap (was 20)
        value: "100"
      - key: NEXT_PUBLIC_SITE_URL      # build time: canonical URLs, share card and sitemap use this origin (docs/operations/render.md)
        value: https://wasel.runs-on.dev
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
