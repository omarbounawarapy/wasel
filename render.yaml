# Render Blueprint: Wasel on the free web service (public demo mode). See docs/operations/render.md.
services:
  - type: web
    name: wasel
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    autoDeployTrigger: checksPass     # deploy a commit only after its CI checks pass
    envVars:
      - key: APP_MODE
        value: public
      - key: CLIENT_IP_HEADER          # Cloudflare in front of Render overwrites this; per-address limits key on it
        value: CF-Connecting-IP
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
