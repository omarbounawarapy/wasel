# 05 §4. Runs on every push and PR: make check with no API keys, then (main only) the image boots in safe public mode.
name: ci
on: [push, pull_request, workflow_dispatch]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  backend:
    name: backend (make check, no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { GROQ_API_KEY: "", GEMINI_API_KEY: "", WA_TOKEN: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version, cache: pip }
      - run: make setup
      - run: make check PYTEST_ARGS="--junitxml=reports/junit.xml"
  image:
    name: image boots safe (public, no secrets)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cod-risk:ci .
      - run: |
          docker run -d --name app -p 8000:8000 -e PORT=8000 cod-risk:ci
          for i in $(seq 1 120); do curl -fsS localhost:8000/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8000/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["mode"]=="public" and d["wa_send"] is False and d["webhook"]=="disabled", d; print("safe defaults ok")'
      - if: failure()
        run: docker logs app || true
