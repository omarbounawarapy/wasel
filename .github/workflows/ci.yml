# Runs on every push and PR: make check with no API keys, then the host path (make + serve):
# build the web UI, start `make serve` with no .env, and require safe public mode + the UI + the smoke test.
name: ci
on: [push, pull_request, workflow_dispatch]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  backend:
    name: backend (make check, no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { GROQ_API_KEY: "", GEMINI_API_KEY: "", WA_TOKEN: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version, cache: pip }
      - run: make setup
      - run: make check PYTEST_ARGS="--junitxml=var/junit.xml"
  audit:
    name: known-vulnerability scan (pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt -r dashboard/requirements.txt
      # Dev tooling is excluded (--omit=dev): eslint-config-next pulls in `braces` (no fixed release exists) and wrangler
      # pulls in sharp through miniflare. Neither ships in the images; revisit when upstream fixes them.
      - name: web (what ships in the static export)
        run: cd web && npm audit --package-lock-only --omit=dev --audit-level=high
      - name: cloudflare worker
        run: cd deploy/cloudflare && npm audit --package-lock-only --omit=dev --audit-level=high
  secrets:
    name: secret scan over the whole git history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GITLEAKS_VERSION: "8.21.2" }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: install gitleaks (version pinned, checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep linux_x64 "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks git --no-banner --redact -v .
  serve:
    name: host path (make web + make serve) boots safe and serves the UI
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { GROQ_API_KEY: "", GEMINI_API_KEY: "", WA_TOKEN: "", WA_APP_SECRET: "", WA_VERIFY_TOKEN: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version, cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make web
      - run: |
          make serve > serve.log 2>&1 &
          python3 scripts/dev/wait_health.py http://localhost:8000
          curl -fsS localhost:8000/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["mode"]=="public" and d["wa_send"] is False and d["webhook"]=="disabled" and d["wa_auto_send"] is False, d; print("safe defaults ok")'
          curl -fsS localhost:8000/dashboard/ | grep -q "Wasel" && echo "web UI served"
          make smoke
      - if: failure()
        run: cat serve.log || true
  cloudflare:
    name: cloudflare (config checks, container image, wrangler dry run; no account)
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version, cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json\ndeploy/cloudflare/package-lock.json" }
      - run: make setup
      - run: make cf-install
      - run: make cf-check
      - run: make cf-smoke
      - run: make web
      - run: make cf-dry-run ENV=production
