# Runs on every push and PR: make check with no API keys, then the host path (make + serve):
# build the web UI, start `make serve` with no .env, and require safe public mode + the UI + the smoke test.
name: ci
on: [push, pull_request, workflow_dispatch]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  backend:
    name: backend (make check, no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { GROQ_API_KEY: "", GEMINI_API_KEY: "", WA_TOKEN: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version, cache: pip }
      - run: make setup
      - run: make check PYTEST_ARGS="--junitxml=var/junit.xml"
  audit:
    name: known-vulnerability scan (pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 22 }
      - name: python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --require-hashes
      # The whole npm tree is checked (dev tooling included). The gate fails on any high or critical advisory that is not
      # on its documented allowlist (scripts/ops/npm_audit_gate.py): the one accepted is braces, reached only via the linter.
      - name: web (whole tree, dev tooling included)
        run: python3 scripts/ops/npm_audit_gate.py web
  secrets:
    name: secret scan over the whole git history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GITLEAKS_VERSION: "8.21.2" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: install gitleaks (version pinned, checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep linux_x64 "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks git --no-banner --redact -v .
  serve:
    name: host path (make web + make serve) boots safe and serves the UI
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { GROQ_API_KEY: "", GEMINI_API_KEY: "", WA_TOKEN: "", WA_APP_SECRET: "", WA_VERIFY_TOKEN: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version, cache: pip }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make web
      - run: cd web && npm run lint -- --max-warnings 0
      - name: every exported page has its own title, description and canonical URL
        run: cd web && npm run check:pages
      - run: |
          make serve > serve.log 2>&1 &
          python3 scripts/dev/wait_health.py http://localhost:8000
          curl -fsS localhost:8000/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["mode"]=="public" and d["wa_send"] is False and d["webhook"]=="disabled" and d["wa_auto_send"] is False, d; print("safe defaults ok")'
          curl -fsS localhost:8000/dashboard/ | grep -q "Wasel" && echo "web UI served"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/dashboard/inbox/)" = 200 && echo "inbox page 200"
          ! grep -rq "localhost:5173" web/dist && echo "bundle has no dev origin"
          make smoke
      - name: accessibility (axe, WCAG 2.2 AA) over every route, light and dark, phone and desktop; skip link
        run: cd web && BASE_URL=http://localhost:8000 npm run a11y
      - if: failure()
        run: cat serve.log || true
  lighthouse:
    name: lighthouse budget (performance, accessibility, LCP, page weight)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci --no-audit --no-fund && NEXT_PUBLIC_SITE_URL=https://wasel.runs-on.dev npm run build
      # Budgets are in web/lighthouserc.json (baseline: docs/operations/render.md, "Load budget").
      - run: cd web && npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
  render:
    name: render image (docker build, boot, smoke test)
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version, cache: pip }
      - run: make setup
      - run: make render-smoke
