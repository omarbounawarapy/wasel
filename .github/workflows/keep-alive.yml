# Keeps the free Render demo awake so judges never hit the 1-minute cold start.
# INACTIVE ON PURPOSE: only the manual trigger is enabled. On submission day, uncomment the schedule block
# below and push (see docs/operations/render.md, "Keep the demo awake"); remove it again after judging.
# Render's free plan sleeps after ~15 min idle, so the ping runs every 10 min. GitHub may delay cron runs.
name: keep-alive
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
permissions: {}
concurrency: { group: keep-alive, cancel-in-progress: true }
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Repository variable DEMO_URL overrides this (Settings, Variables).
      # Current demo URL: https://wasel.runs-on.dev
      URL: ${{ vars.DEMO_URL || 'https://wasel.runs-on.dev' }}
    steps:
      - name: ping /api/health (retries cover a cold start)
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 60 \
            "$URL/api/health" | head -c 300; echo
