name: Bug report
description: Something in the app, the API or the scoring behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, the order ref (e.g. #2601) or the customer text you used. Synthetic data only, never a real customer's messages.
      placeholder: |
        1. make up
        2. open #2601, simulate reply "..."
        3. ...
    validations: { required: true }
  - type: textarea
    id: health
    attributes:
      label: Output of GET /api/health
      description: Shows mode, LLM path and versions. Remove anything that looks like a key.
      render: json
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [scoring / reasons, LLM extraction, API / worker / states, WhatsApp, dashboard, deploy / CI, content / language, not sure]
    validations: { required: true }
