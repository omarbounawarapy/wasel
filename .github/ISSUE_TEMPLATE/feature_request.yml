name: Idea or improvement
description: Suggest a change to what the app does or how it looks
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who hits it (seller, customer, operator) and when.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations: { required: true }
