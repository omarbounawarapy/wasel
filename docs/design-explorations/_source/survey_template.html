<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasel design survey</title>
<style>
:root{--bg:#F4F5F3;--card:#fff;--ink:#17212B;--mute:#566270;--line:#D5DAD6;--p:#0B6E6E;--pb:#E3F0EF;--onp:#fff;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.hrow b{flex:1;font-size:16px}
.lang button{border:1px solid var(--line);background:var(--card);padding:8px 12px;font:inherit;font-size:14px;min-height:40px;color:var(--ink)}
.lang button.on{background:var(--p);color:var(--onp);border-color:var(--p)}
.bar{height:6px;background:var(--line);max-width:900px;margin:8px auto 0}.bar i{display:block;height:100%;background:var(--p);width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:26px;line-height:1.25;margin:8px 0 10px}h2{font-size:21px;margin:22px 0 8px}
p.lead{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;margin:14px 0}
.q{font-weight:700;margin:0 0 10px}.q em{color:var(--bad);font-style:normal}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);padding:10px 14px;min-height:48px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;text-align:start}
.opt.on{border-color:var(--p);background:var(--pb);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scale .opt{text-align:center;font-size:20px;font-weight:700}
.sl{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-top:6px}
.one .opt{flex:1 1 100%}.one.short .opt{flex:1 1 auto}
.shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.shot{flex:0 0 auto;scroll-snap-align:start;text-align:center;font-size:14px;color:var(--mute)}
.shot img{display:block;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.shot.d img{width:min(78vw,520px);height:auto}.shot.p img{width:min(46vw,200px);height:auto}
.full{display:inline-block;margin-top:8px;color:var(--p);font-weight:600}
textarea,input[type=text]{width:100%;border:2px solid var(--line);padding:10px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:90px}
details summary{cursor:pointer;color:var(--p);font-weight:600;min-height:44px;display:flex;align-items:center}
nav.bt{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
nav.bt div{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:2px solid var(--p);background:var(--p);color:var(--onp);font:inherit;font-weight:700;padding:12px 22px;min-height:52px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--p)}.btn:disabled{opacity:.45}
.hint{flex:1;color:var(--bad);font-size:14px}
.big{width:100%;margin:8px 0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);overflow:auto;z-index:20;display:none;padding:10px}.lb img{display:block;margin:0 auto;max-width:none;width:min(1280px,100%);height:auto;background:#fff}.lb span{position:fixed;top:8px;right:14px;color:#fff;font-size:34px}
.letter{display:inline-grid;place-items:center;width:40px;height:40px;background:var(--p);color:var(--onp);font-weight:700;margin-inline-end:8px}
.code{width:100%;font:12px ui-monospace,monospace;border:1px solid var(--line);padding:8px;height:80px;background:#fff}
[dir=rtl] .lb span{right:auto;left:14px}
</style>
</head>
<body>
<header><div class="hrow"><b id="brand"></b><span class="lang" id="lang"></span></div><div class="bar"><i id="prog"></i></div></header>
<main id="main"></main>
<nav class="bt"><div><button class="btn sec" id="back"></button><span class="hint" id="hint"></span><button class="btn" id="next"></button></div></nav>
<div class="lb" id="lb"><span>×</span><img id="lbi" alt=""></div>
<script>
var D = /*__DATA__*/null;
var T = D.T, LANGS = ["en","fr","ar"], LNAME = {en:"EN",fr:"FR",ar:"عربي"};
var mem = {};
function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ if(v===undefined) return mem[k]||null; mem[k]=v; } }
function rid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
var S = null;
try{ S = JSON.parse(ls("wasel_survey")||"null"); }catch(e){ S = null; }
if(!S || S.v!==1){ S = {v:1, id:rid(), t:new Date().toISOString(), lang:"en", order:shuffle(D.DIRS.map(function(d){return d.id;})), profile:{}, d:{}, final:{}, step:0}; }
function save(){ ls("wasel_survey", JSON.stringify(S)); }
function t(k){ return (T[S.lang] && T[S.lang][k]) || T.en[k] || k; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var LET = {en:["A","B","C"], fr:["A","B","C"], ar:["أ","ب","ج"]};
function letter(i){ return LET[S.lang][i]; }
var STEPS = 1 + D.DIRS.length + 2; // intro, designs, final, send

function ans(scope, id){ if(scope==="profile") return S.profile; if(scope==="final") return S.final; S.d[id] = S.d[id]||{}; return S.d[id]; }

function qHTML(q, scope, id){
  var a = ans(scope, id), cur = a[q.k], h = '<div class="card"><p class="q">'+esc(t(q.q))+(q.req?' <em>*</em>':'')+'</p>';
  if(q.kind==="scale"){
    h += '<div class="scale">'+q.o.map(function(o){ return '<button class="opt'+(cur===o?' on':'')+'" data-s="'+scope+'" data-i="'+(id||"")+'" data-k="'+q.k+'" data-v="'+o+'" data-m="one">'+o+'</button>'; }).join("")+'</div><div class="sl"><span>'+esc(t("t_lo"))+'</span><span>'+esc(t("t_hi"))+'</span></div>';
  } else if(q.kind==="one" || q.kind==="many"){
    var cls = q.kind==="one" && q.o.length<=3 ? "opts one short" : "opts";
    h += '<div class="'+cls+'">'+q.o.map(function(o){ var on = q.kind==="one" ? cur===o : (cur||[]).indexOf(o)>-1; return '<button class="opt'+(on?' on':'')+'" data-s="'+scope+'" data-i="'+(id||"")+'" data-k="'+q.k+'" data-v="'+o+'" data-m="'+q.kind+'" data-max="'+(q.max||0)+'">'+esc(t(o))+'</button>'; }).join("")+'</div>';
  } else if(q.kind==="design"){
    h += '<div class="opts">'+S.order.map(function(did,i){ return '<button class="opt'+(cur===did?' on':'')+'" data-s="'+scope+'" data-k="'+q.k+'" data-v="'+did+'" data-m="one"><span class="letter">'+letter(i)+'</span>'+esc(t("design_letter"))+' '+letter(i)+'</button>'; }).join("")+
         '<button class="opt'+(cur==="none"?' on':'')+'" data-s="'+scope+'" data-k="'+q.k+'" data-v="none" data-m="one">'+esc(t("none"))+'</button></div>';
  } else if(q.kind==="text"){
    h += '<details'+(cur?' open':'')+'><summary>✎ '+esc(t("write"))+'</summary><textarea data-s="'+scope+'" data-i="'+(id||"")+'" data-k="'+q.k+'" dir="auto">'+esc(cur||"")+'</textarea></details>';
  } else if(q.kind==="textshort"){
    h += '<input type="text" data-s="'+scope+'" data-k="'+q.k+'" value="'+esc(cur||"")+'" dir="auto">';
  }
  return h+'</div>';
}

function required(step){
  var qs = [], sc, id;
  if(step===0){ qs = D.PROFILE; sc = "profile"; }
  else if(step<=D.DIRS.length){ qs = D.PER; sc = "d"; id = S.order[step-1]; }
  else return true;
  return qs.every(function(q){ return !q.req || ans(sc,id)[q.k]; });
}

function render(){
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang==="ar" ? "rtl" : "ltr";
  document.getElementById("brand").textContent = t("brand");
  document.getElementById("lang").innerHTML = LANGS.map(function(l){ return '<button class="'+(l===S.lang?"on":"")+'" data-l="'+l+'">'+LNAME[l]+'</button>'; }).join("");
  var st = S.step, h = "";
  if(st===0){
    h += '<h1>'+esc(t("intro_h"))+'</h1><p class="lead">'+esc(t("intro_p"))+'</p><h2>'+esc(t("about"))+'</h2>'+D.PROFILE.map(function(q){ return qHTML(q,"profile"); }).join("");
  } else if(st<=D.DIRS.length){
    var did = S.order[st-1], dd = D.DIRS.filter(function(x){return x.id===did;})[0];
    h += '<h1><span class="letter">'+letter(st-1)+'</span>'+esc(t("design"))+' '+letter(st-1)+'</h1><p class="lead">'+esc(t("look"))+'</p><div class="shots">'+
      D.SHOTS.map(function(s){ var kind = s.img[0]==="d"?"d":"p"; return '<div class="shot '+kind+'"><img src="'+D.IMGS[did+"-"+s.img]+'" data-z="1" alt="'+esc(t(s.cap))+'"><div>'+esc(t(s.cap))+'</div></div>'; }).join("")+
      '</div><a class="full" href="'+dd.file+'" target="_blank">'+esc(t("open_full"))+' ↗</a>'+D.PER.map(function(q){ return qHTML(q,"d",did); }).join("");
  } else if(st===D.DIRS.length+1){
    h += '<h1>'+esc(t("final_h"))+'</h1>'+D.FINAL.map(function(q){ return qHTML(q,"final"); }).join("");
  } else {
    h += '<h1>'+esc(t("send_h"))+'</h1><p class="lead">'+esc(t("send_p"))+'</p><button class="btn big" id="wa">'+esc(t("wa"))+'</button><button class="btn big sec" id="mail">'+esc(t("mail"))+'</button><button class="btn big sec" id="dl">'+esc(t("dl"))+'</button><button class="btn big sec" id="cp">'+esc(t("copy"))+'</button><textarea class="code" id="code" readonly></textarea><p class="lead">'+esc(t("sent_note"))+'</p>';
  }
  document.getElementById("main").innerHTML = h;
  var last = st===STEPS-1;
  document.getElementById("prog").style.width = Math.round(100*st/(STEPS-1))+"%";
  document.getElementById("back").style.visibility = st===0 ? "hidden" : "visible";
  document.getElementById("back").textContent = t("back");
  var nx = document.getElementById("next");
  nx.style.display = last ? "none" : "";
  nx.textContent = st===0 ? t("start") : st===D.DIRS.length+1 ? t("finish") : t("next");
  var ok = required(st); nx.disabled = !ok; document.getElementById("hint").textContent = ok ? "" : t("need");
  if(last) fillSend();
  window.scrollTo(0,0);
}

function payload(){
  var p = {v:1, id:S.id, t:S.t, sent:new Date().toISOString(), lang:S.lang, order:S.order, profile:S.profile, d:S.d, final:S.final};
  return p;
}
function b64u(str){ var b = new TextEncoder().encode(str), s = ""; b.forEach(function(x){ s += String.fromCharCode(x); }); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function code(){ return "W1." + b64u(JSON.stringify(payload())); }
function fillSend(){
  var c = code(); document.getElementById("code").value = c;
  document.getElementById("wa").onclick = function(){ window.open("https://wa.me/"+(D.WA||"")+"?text="+encodeURIComponent(c), "_blank"); };
  document.getElementById("mail").onclick = function(){ location.href = "mailto:"+(D.MAIL||"")+"?subject="+encodeURIComponent("Wasel design survey")+"&body="+encodeURIComponent(c); };
  document.getElementById("dl").onclick = function(){ var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload(),null,1)],{type:"application/json"})); a.download = "wasel-survey-"+S.id+".json"; document.body.appendChild(a); a.click(); a.remove(); };
  document.getElementById("cp").onclick = function(){ var el = document.getElementById("code"); el.select(); var done = function(){ document.getElementById("cp").textContent = t("copied"); }; if(navigator.clipboard){ navigator.clipboard.writeText(c).then(done, function(){ document.execCommand("copy"); done(); }); } else { document.execCommand("copy"); done(); } };
}

document.addEventListener("click", function(e){
  var el = e.target.closest("button,img");
  if(!el) return;
  if(el.dataset.l){ S.lang = el.dataset.l; save(); render(); return; }
  if(el.dataset.z){ document.getElementById("lbi").src = el.src; document.getElementById("lb").style.display = "block"; return; }
  if(el.dataset.m){
    var a = ans(el.dataset.s, el.dataset.i), k = el.dataset.k, v = el.dataset.v;
    if(el.dataset.m==="one"){ a[k] = a[k]===v && !/^(role|dev|lang|trust|easy|use)$/.test(k) ? undefined : v; }
    else {
      var arr = a[k] = a[k]||[], i = arr.indexOf(v), mx = parseInt(el.dataset.max||"0",10);
      if(i>-1) arr.splice(i,1); else { if(v==="c_nothing") arr.length = 0; else { var j = arr.indexOf("c_nothing"); if(j>-1) arr.splice(j,1); } if(!mx || arr.length<mx) arr.push(v); }
    }
    save();
    var y = window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(el.id==="next"){ if(required(S.step)){ S.step++; save(); render(); } return; }
  if(el.id==="back"){ if(S.step>0){ S.step--; save(); render(); } return; }
});
document.getElementById("lb").addEventListener("click", function(){ this.style.display = "none"; });
document.addEventListener("input", function(e){
  var el = e.target; if(!el.dataset || !el.dataset.k || (el.tagName!=="TEXTAREA" && el.type!=="text")) return;
  ans(el.dataset.s, el.dataset.i)[el.dataset.k] = el.value; save();
});
render();
</script>
</body>
</html>
