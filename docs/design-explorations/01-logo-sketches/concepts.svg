<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f4f6f9"/>
  <g font-family="Noto Sans, sans-serif">
  <!-- 1 Route W -->
  <g transform="translate(40,40)">
    <rect width="540" height="320" rx="20" fill="#fff"/>
    <g transform="translate(40,70) scale(1.5)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
      <path d="M14 30 L34 90 L60 42" stroke="#12386b"/>
      <path d="M60 42 L86 90 L106 30" stroke="#12386b"/>
      <path d="M86 90 L106 30" stroke="#00abab"/>
      <circle cx="106" cy="30" r="7" fill="#00abab" stroke="none"/>
    </g>
    <text x="250" y="150" font-size="64" font-weight="800" fill="#0b1d33">Wasel</text>
    <text x="252" y="195" font-size="30" fill="#00777a" font-family="Noto Sans Arabic">واصل</text>
    <text x="30" y="40" font-size="16" fill="#6b7280">1 · Route W — one line that ends at the door</text>
  </g>
  <!-- 2 Parcel + gauge -->
  <g transform="translate(620,40)">
    <rect width="540" height="320" rx="20" fill="#fff"/>
    <g transform="translate(40,70) scale(1.5)" fill="none" stroke-linejoin="round">
      <path d="M60 10 L103 35 L103 85 L60 110 L17 85 L17 35 Z" stroke="#12386b" stroke-width="9"/>
      <path d="M34 72 A26 26 0 0 1 47.5 49.5" stroke="#2f9e6e" stroke-width="9"/>
      <path d="M50 47.5 A26 26 0 0 1 70 47.5" stroke="#f2a900" stroke-width="9"/>
      <path d="M72.5 49.5 A26 26 0 0 1 86 72" stroke="#d6453d" stroke-width="9"/>
      <path d="M60 72 L74 54" stroke="#0b1d33" stroke-width="5" stroke-linecap="round"/>
      <circle cx="60" cy="72" r="5" fill="#0b1d33" stroke="none"/>
    </g>
    <text x="250" y="150" font-size="64" font-weight="800" fill="#0b1d33">Wasel</text>
    <text x="252" y="195" font-size="30" fill="#00777a" font-family="Noto Sans Arabic">واصل</text>
    <text x="30" y="40" font-size="16" fill="#6b7280">2 · Parcel gauge — the box that reads the risk</text>
  </g>
  <!-- 3 Waw -->
  <g transform="translate(40,400)">
    <rect width="540" height="320" rx="20" fill="#fff"/>
    <g transform="translate(40,70) scale(1.5)" fill="none" stroke-linecap="round" stroke-width="13">
      <circle cx="64" cy="46" r="20" stroke="#12386b"/>
      <path d="M82 58 C90 92 72 110 34 104" stroke="#12386b"/>
      <circle cx="24" cy="102" r="7" fill="#00abab" stroke="none"/>
    </g>
    <text x="250" y="150" font-size="64" font-weight="800" fill="#0b1d33">Wasel</text>
    <text x="252" y="195" font-size="30" fill="#00777a" font-family="Noto Sans Arabic">واصل</text>
    <text x="30" y="40" font-size="16" fill="#6b7280">3 · Waw — Arabic و as a route ending at a stop</text>
  </g>
  <!-- 4 Pin parcel -->
  <g transform="translate(620,400)">
    <rect width="540" height="320" rx="20" fill="#fff"/>
    <g transform="translate(40,70) scale(1.5)">
      <path d="M60 112 C60 112 20 74 20 48 A40 40 0 0 1 100 48 C100 74 60 112 60 112Z" fill="#12386b"/>
      <rect x="42" y="30" width="36" height="36" rx="6" fill="#fff"/>
      <rect x="42" y="44" width="36" height="8" fill="#00abab"/>
    </g>
    <text x="250" y="150" font-size="64" font-weight="800" fill="#0b1d33">Wasel</text>
    <text x="252" y="195" font-size="30" fill="#00777a" font-family="Noto Sans Arabic">واصل</text>
    <text x="30" y="40" font-size="16" fill="#6b7280">4 · Parcel pin — a box that reaches the address</text>
  </g>
  </g>
</svg>
