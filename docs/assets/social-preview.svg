    </g>
    <text x="370" y="484" fill="#94a3b8" font-size="48">→</text>
    <g transform="translate(440,420)">
      <rect width="250" height="96" rx="16" fill="#14532d"/>
      <text x="125" y="40" fill="#bbf7d0" font-size="22" text-anchor="middle">v2 · after reply</text>
      <text x="125" y="80" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">LOW 16</text>
    </g>

    <g fill="#e2e8f0" font-size="26">
      <text x="780" y="440">Darija · Arabizi · Arabic · French</text>
