<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
    <text x="80" y="150" fill="#94a3b8" font-size="28" letter-spacing="4">Z-TEAM · COME BUILD WITH AI 2026</text>
    <text x="80" y="245" fill="#f8fafc" font-size="96" font-weight="700">COD Risk</text>
